# Xcode project description for XcodeGen.
# This is the source of truth. The KillSwitch.xcodeproj itself is generated with:
#   xcodegen generate
# and is not stored in git (see .gitignore).

name: KillSwitch

options:
  bundleIdPrefix: com.killswitch
  deploymentTarget:
    macOS: "13.0"            # SMAppService and MenuBarExtra require macOS 13+
  createIntermediateGroups: true
  groupSortPosition: top

# Shared build settings for all targets.
settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode — less fighting strict concurrency on an MVP
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"         # ad-hoc signing: builds locally without a developer team
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ONLY_ACTIVE_ARCH: YES

targets:

  # Shared module: types and the XPC contract, linked into both the app and the daemon.
  KillSwitchShared:
    type: library.static
    platform: macOS
    sources:
      - Shared
    settings:
      base:
        PRODUCT_NAME: KillSwitchShared
        SKIP_INSTALL: YES

  # Daemon logic as a separate library — so it can be covered by tests (an executable
  # with main.swift is awkward to test). StateStore, PFRulesetManager, Watchdog,
  # ConnectionObserver, etc. live here.
  KillSwitchDaemonCore:
    type: library.static
    platform: macOS
    sources:
      - path: Daemon
        excludes:
          - "main.swift"
          - "killswitch.pf.template"
          - "com.killswitch.daemon.plist"
    dependencies:
      - target: KillSwitchShared
    settings:
      base:
        PRODUCT_NAME: KillSwitchDaemonCore
        SKIP_INSTALL: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES      # for @testable import in tests

  # The privileged daemon (a command-line executable) — a thin wrapper over
  # KillSwitchDaemonCore.
  KillSwitchDaemon:
    type: tool
    platform: macOS
    sources:
      - Daemon/main.swift
    dependencies:
      - target: KillSwitchShared
      - target: KillSwitchDaemonCore
    settings:
      base:
        PRODUCT_NAME: com.killswitch.daemon
        PRODUCT_BUNDLE_IDENTIFIER: com.killswitch.daemon
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

  # Daemon logic tests (logic tests, no host app).
  KillSwitchDaemonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DaemonTests
    dependencies:
      - target: KillSwitchDaemonCore
      - target: KillSwitchShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # The menu-bar app — a thin remote control on top of the daemon.
  KillSwitch:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - target: KillSwitchShared
      # The daemon is needed only as a build-order dependency (build it before the app).
      # The actual bundle embedding is done by the postBuildScript below — XcodeGen places
      # a tool target in Resources, but we need Contents/MacOS (the SMAppService convention).
      - target: KillSwitchDaemon
        embed: false
        link: false
    postBuildScripts:
      - name: Embed daemon and launchd plist into the bundle
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Daemon executable -> Contents/MacOS (SMAppService convention).
          SRC="${BUILT_PRODUCTS_DIR}/com.killswitch.daemon"
          DEST_BIN="${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}"
          mkdir -p "${DEST_BIN}"
          ditto "${SRC}" "${DEST_BIN}/com.killswitch.daemon"
          # launchd plist -> Contents/Library/LaunchDaemons (required by SMAppService.daemon).
          PLIST_SRC="${SRCROOT}/Daemon/com.killswitch.daemon.plist"
          DEST_PLIST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          mkdir -p "${DEST_PLIST}"
          ditto "${PLIST_SRC}" "${DEST_PLIST}/com.killswitch.daemon.plist"
    settings:
      base:
        PRODUCT_NAME: KillSwitch
        PRODUCT_BUNDLE_IDENTIFIER: com.killswitch.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES      # agent app: menu bar only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  KillSwitch:
    build:
      targets:
        KillSwitch: all
        KillSwitchDaemon: all
    run:
      config: Debug
  # Scheme for running tests: xcodebuild test -scheme KillSwitchTests
  KillSwitchTests:
    build:
      targets:
        KillSwitchDaemonCore: all
    test:
      config: Debug
      targets:
        - KillSwitchDaemonTests
